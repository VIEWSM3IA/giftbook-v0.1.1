name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: giftbook
          POSTGRES_PASSWORD: giftbook_test
          POSTGRES_DB: giftbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U giftbook -d giftbook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://giftbook:giftbook_test@127.0.0.1:5432/giftbook
      NODE_ENV: development
      ALLOW_LOCAL_LOGIN: 'true'
      HOST: 127.0.0.1
      PORT: 43117
      H5_SCREENSHOT_DIR: /tmp/giftbook-h5-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run check
      - run: npm test
      - name: Start H5 preview
        run: |
          node scripts/serve-h5.js > /tmp/giftbook-h5.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43117/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/giftbook-h5.log
          exit 1
      - run: npm run check:h5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5-evidence
          path: /tmp/giftbook-h5-evidence/
          if-no-files-found: ignore
